name: wxread

concurrency:
  group: ${{ github.workflow }} # 使用工作流名称作为并发组的key
  cancel-in-progress: false

on:
  # 定时由服务器 crontab 调用 workflow_dispatch（scheduled=true）准点触发：
  # GitHub 的 schedule 实测每天延迟近 4 小时。
  # 下面这行只供页面显示“下次执行”，改时间时要和服务器 crontab 一起改（UTC）。
  # external-cron: '7 17 * * *'
  workflow_dispatch:
    inputs:
      account_id:
        description: Empty runs all enabled accounts
        required: false
        type: string
      scheduled:
        description: Set by the timer so the pause switch applies
        required: false
        type: boolean
        default: false

permissions:
  contents: write

run-name: 'wxread-reading ${{ inputs.account_id || ''all'' }}'

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment: AutoRead
    timeout-minutes: 360

    steps:

    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements-actions.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-actions.txt

    - name: Run deployment script
      env:
        GH_TOKEN: ${{ github.token }}
        WXREAD_CONTROL_KEY: ${{ secrets.WXREAD_CONTROL_KEY }}
        READ_ACCOUNT_ID: ${{ inputs.account_id }}
        READ_SCHEDULED: ${{ inputs.scheduled }}
        WXREAD_CURL_BASH: ${{ secrets.WXREAD_CURL_BASH }}
        WXREAD_ACCOUNTS_JSON: ${{ secrets.WXREAD_ACCOUNTS_JSON }}
        PUSH_METHOD: ${{ secrets.PUSH_METHOD }}
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        SERVERCHAN_SPT:  ${{ secrets.SERVERCHAN_SPT }}
        WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        WEBHOOK_HEADERS: ${{ secrets.WEBHOOK_HEADERS }}
        WEBHOOK_TYPE: ${{ vars.WEBHOOK_TYPE }}
        READ_NUM: ${{ vars.READ_NUM }}  # 使用 Repository Variables
        SMTP_HOST: ${{ secrets.SMTP_HOST }}
        SMTP_PORT: ${{ vars.SMTP_PORT }}
        SMTP_SECURITY: ${{ vars.SMTP_SECURITY }}
        SMTP_USER: ${{ secrets.SMTP_USER }}
        SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        SMTP_FROM: ${{ secrets.SMTP_FROM }}
        EMAIL_TO: ${{ secrets.EMAIL_TO }}

      run: |
        python github_worker.py read

  keepalive-job:
    name: Keepalive Workflow
    if: ${{ always() }}
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1.2.1
